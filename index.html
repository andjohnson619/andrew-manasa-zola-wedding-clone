  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header" id="top">
      <nav class="nav-desktop" aria-label="Primary">
        <ul class="nav-desktop__list"></ul>
      </nav>
      <button
        type="button"
        class="nav-toggle"
        aria-expanded="false"
        aria-controls="mobile-panel"
        aria-label="Open menu"
      >
        <span class="nav-toggle__lines" aria-hidden="true"></span>
      </button>
    </header>

    <div
      class="mobile-panel"
      id="mobile-panel"
      hidden
      aria-label="Mobile navigation"
    >
      <nav aria-label="Mobile">
        <ul class="mobile-panel__list"></ul>
      </nav>
    </div>

    <main id="main">
      <section class="hero" id="home" aria-label="Photos">
        <div class="hero__slides"></div>
        <div class="hero__dots" role="tablist" aria-label="Photo slides"></div>
      </section>

      <section class="intro" aria-labelledby="couple-heading">
        <div class="intro__inner">
          <h1 id="couple-heading" class="visually-hidden">Couple names</h1>
          <div class="couple-names" id="couple-names"></div>
          <p class="wedding-date" id="wedding-date-display"></p>
          <p class="wedding-place" id="wedding-place"></p>
          <div class="countdown" id="countdown" aria-live="polite"></div>
        </div>
      </section>

      <section class="content-block" id="schedule" tabindex="-1">
        <div class="content-block__inner">
          <h2>Schedule</h2>
          <div id="schedule-body"></div>
        </div>
      </section>

      <section class="content-block" id="travel" tabindex="-1">
        <div class="content-block__inner">
          <h2>Travel</h2>
          <div id="travel-body" class="prose"></div>
        </div>
      </section>

      <section class="content-block" id="registry" tabindex="-1">
        <div class="content-block__inner">
          <h2>Registry</h2>
          <div id="registry-body" class="prose"></div>
        </div>
      </section>

      <section class="content-block" id="gallery" tabindex="-1">
        <div class="content-block__inner">
          <h2>Gallery</h2>
          <div class="gallery-grid" id="gallery-grid"></div>
        </div>
      </section>

      <section class="content-block" id="faqs" tabindex="-1">
        <div class="content-block__inner">
          <h2>FAQs</h2>
          <div id="faqs-body" class="prose"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p class="site-footer__note">
        Static clone for editing. Original theme on Zola: Jessenia (Pale Sage).
      </p>
    </footer>

    <script src="js/main.js" type="module"></script>
  </body>
