<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta property="og:image" content="https://images.zola.com/4621f6ff-224c-4fb0-a254-cb3802482c96" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <h2 class="couple-name-nav">Manasa &amp; Andrew</h2>
    <button class="mobile-nav-toggle" aria-label="Toggle navigation" onclick="document.querySelector('.nav-bar').classList.toggle('open')">&#9776;</button>
  </header>

  <nav class="nav-bar">
    <ul>
      <li class="active"><a href="index.html">Home</a></li>
      <li><a href="schedule.html">Schedule</a></li>
      <li><a href="travel.html">Travel</a></li>
      <li><a href="faq.html">FAQs</a></li>
    </ul>
  </nav>

  <section class="hero">
    <div class="hero-stacked">
      <img class="hero-img-back" src="https://images.zola.com/3577dc93-1e1b-4c0d-9ff1-e0254895088d?w=1000" alt="Manasa and Andrew" loading="lazy" />
      <img class="hero-img-front" src="https://images.zola.com/4621f6ff-224c-4fb0-a254-cb3802482c96?w=1000" alt="Manasa and Andrew" loading="lazy" />
    </div>
  </section>

  <div class="content-wrap">
    <div class="content-center">
      <div class="names-section">
        <h1 class="couple-name">Manasa Datla</h1>
        <span class="ampersand">&amp;</span>
        <h1 class="couple-name">Andrew Johnson</h1>

        <div class="date-location">
          <h3 class="event-date">October 10, 2026</h3>
          <p class="event-location">San Diego, CA</p>
        </div>

        <div class="countdown" id="countdown"></div>
      </div>
    </div>
  </div>


  <script>
    (function () {
      var wedding = new Date('2026-10-10T00:00:00');
      function update() {
        var now = new Date();
        var diff = wedding - now;
        if (diff <= 0) { document.getElementById('countdown').textContent = "Today is the day!"; return; }
        var d = Math.floor(diff / 86400000);
        var h = Math.floor((diff % 86400000) / 3600000);
        var m = Math.floor((diff % 3600000) / 60000);
        var s = Math.floor((diff % 60000) / 1000);
        document.getElementById('countdown').innerHTML =
          '<span>' + d + ' days</span>' +
          '<span>' + h + ' hours</span>' +
          '<span>' + m + ' minutes</span>' +
          '<span>' + s + ' seconds</span>';
      }
      update();
      setInterval(update, 1000);
    })();
  </script>
</body>
</html>
